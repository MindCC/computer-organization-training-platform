<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>半加器、全加器与运算器 · 第三章课堂互动演示</title>
<style>
:root{color-scheme:light;font-family:system-ui,"Microsoft YaHei",sans-serif;color:#17333d;background:#f4f7f8;--teal:#087b70;--line:#d5e3df;--muted:#526775}*{box-sizing:border-box}body{margin:0}header,main{max-width:1280px;margin:auto;padding:24px}header{padding-bottom:12px}h1{font-size:28px;margin:7px 0 10px}h2{font-size:19px;margin:0 0 16px}h3{font-size:16px;margin:0 0 12px}p{line-height:1.7;margin:8px 0;color:var(--muted)}.eyebrow{color:var(--teal);font-size:13px;font-weight:700}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}button,select,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:7px;background:#fff;color:#234c48;padding:10px 14px}button:hover{background:#e9f5ef}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:3px}.tabs [aria-selected=true],.primary{background:var(--teal);color:#fff;border-color:var(--teal)}main{padding-top:12px}.workspace{display:grid;grid-template-columns:255px minmax(0,1fr);gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}.controls{display:grid;align-content:start;gap:16px}.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}.switch button{min-width:66px;font-size:20px;font-family:Consolas,monospace;font-weight:700}.switch button[aria-pressed=true]{background:#dcf1e8;color:#076b60;border-color:#69b69f}.number-label{display:grid;gap:7px}.number-label input,.number-label select{width:100%;padding:9px;border:1px solid #bfcfd0;border-radius:6px;color:#17333d;background:#fff}.hint{font-size:13px;line-height:1.7;color:#526775}.circuit-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}.circuit-head p{font-size:13px}.circuit-svg{display:block;width:100%;min-height:260px;background:#f7fbf9;border:1px solid #e2ece7;border-radius:9px;margin:10px 0 16px}.wire{stroke:#a9bdba;stroke-width:3;fill:none;stroke-linejoin:round}.wire.on{stroke:#0b9b7e;stroke-width:4}.gate{stroke:#37695e;stroke-width:2;fill:white}.lamp{stroke:#708985;stroke-width:2;fill:#e5edeb}.lamp.on{fill:#c2f1df;stroke:#0b9b7e}.signal-label{fill:#17333d;font-size:15px;text-anchor:middle}.signal-bit{fill:#076b60;font:700 18px Consolas,monospace;text-anchor:middle}.results{display:flex;flex-wrap:wrap;gap:12px}.result{padding:12px 16px;border:1px solid #cee3da;border-radius:8px;background:#edf8f2;min-width:110px}.result span{display:block;color:#46645b;font-size:12px}.result strong{font-family:Consolas,monospace;font-size:27px;color:#087b70}.formula{margin-top:14px;color:#345650;font-family:Consolas,"Microsoft YaHei",monospace;font-size:14px;line-height:1.7}.table-panel{margin-top:18px;overflow:auto}table{border-collapse:collapse;width:100%;font:14px Consolas,monospace;text-align:center}th,td{border-bottom:1px solid #e1eae6;padding:10px}th{color:#3a6157;background:#f0f7f3}tr.active{background:#e0f3e9}td button{border:0;background:transparent;padding:2px 10px;font-family:inherit}.quiz-panel{max-width:820px;margin:auto}.quiz-options{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.quiz-options button{min-width:90px;font:700 22px Consolas,monospace}.quiz-feedback{min-height:34px;font-weight:600;color:#087b70}.quiz-feedback.wrong{color:#945512}.quiz-status{font-size:13px;color:#526775}footer{max-width:1280px;margin:0 auto;padding:10px 24px 30px;color:#526775;font-size:12px}[hidden]{display:none!important}@media(max-width:700px){header,main{padding:16px}.workspace{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}.controls h2,.controls .hint{grid-column:1/-1}h1{font-size:23px}.circuit-svg{min-height:220px}.panel{padding:16px}.result{min-width:90px;padding:10px}}
</style><link rel="stylesheet" href="demo-theme.css">
</head><body class="demo-theme">
<header><span class="eyebrow">第三章 · 运算单元设计</span><h1>半加器、全加器与运算器</h1><p class="subtitle">切换输入，观察门电路如何产生和位与进位，再把四个全加器串成 4 位 ALU。</p><nav class="tabs" role="tablist" aria-label="选择演示"><button role="tab" aria-selected="true" data-mode="half">半加器</button><button role="tab" aria-selected="false" data-mode="full">全加器</button><button role="tab" aria-selected="false" data-mode="alu">4 位 ALU</button><button role="tab" aria-selected="false" data-mode="quiz">随堂练习</button></nav></header>
<main><section id="explore"><div class="workspace"><aside class="panel controls"><h2>输入信号</h2><div class="switch" data-bit><span>输入 A</span><button id="a-bit" type="button" aria-label="切换输入 A" aria-pressed="false">0</button></div><div class="switch" data-bit><span>输入 B</span><button id="b-bit" type="button" aria-label="切换输入 B" aria-pressed="false">0</button></div><div class="switch" id="cin-control"><span>输入进位 Cin</span><button id="cin-bit" type="button" aria-label="切换输入进位 Cin" aria-pressed="false">0</button></div><label class="number-label" data-word hidden>输入 A（0–15）<input id="a-word" type="number" min="0" max="15" value="0"></label><label class="number-label" data-word hidden>输入 B（0–15）<input id="b-word" type="number" min="0" max="15" value="0"></label><label class="number-label" data-word hidden>运算选择<select id="op"><option value="ADD">ADD · 加法</option><option value="AND">AND · 按位与</option><option value="OR">OR · 按位或</option><option value="XOR">XOR · 按位异或</option></select></label><p class="hint" id="input-hint">半加器没有输入进位。1 表示高电平，0 表示低电平；绿色连线表示当前高电平。</p></aside><article class="panel"><div class="circuit-head"><h2 id="stage-title">半加器信号图</h2><p>当前信号实时计算</p></div><svg id="circuit" class="circuit-svg" viewBox="0 0 600 320" role="img" aria-label="半加器逻辑门与实时信号"></svg><div id="results" class="results" aria-live="polite"></div><div id="formula" class="formula"></div></article></div><section class="panel table-panel"><h3 id="table-title">半加器真值表 · 点击一行加载输入</h3><table id="truth-table"></table></section></section>
<section id="quiz" class="panel quiz-panel" hidden><h2>随堂练习</h2><p>题目由当前加法器和 ALU 算法生成；每 5 题可在平台中记一批演示练习。</p><p id="quiz-prompt"></p><div id="quiz-options" class="quiz-options"></div><div id="quiz-feedback" class="quiz-feedback" aria-live="polite"></div><div class="quiz-status" id="quiz-status">已答 0 题</div><button id="quiz-next" class="primary" type="button" disabled>下一题</button></section>
</main><footer>本演示的 ADD 为 4 位无符号加法；Cout 是最高位进位，Z 表示低 4 位结果为零。独立打开时仍可操作全部演示与练习。</footer>
<script src="adder-alu-core.js"></script><script>
(function(){'use strict';
const core=globalThis.AdderAluCore,$=id=>document.getElementById(id);let mode='half',a=0,b=0,cin=0,op='ADD',quizIndex=0,answered=0,correct=0,question=null,quizLocked=false;
function gate(type,x,y,label,value){const shape=type==='and'?'<path class="gate" d="M-28-18H-6A18 18 0 0 1-6 18H-28Z"/>':type==='or'?'<path class="gate" d="M-28-18Q3-18 26 0Q3 18-28 18Q-10 0-28-18Z"/>':'<path class="gate" d="M-28-18Q3-18 26 0Q3 18-28 18Q-10 0-28-18Z"/><path class="gate" fill="none" d="M-35-18Q-17 0-35 18"/>';
return '<g transform="translate('+x+' '+y+')">'+shape+'<text class="signal-label" y="-31">'+label+'</text><text class="signal-bit" x="40" y="6">'+value+'</text></g>';}
function lamp(x,y,label,value){return '<g transform="translate('+x+' '+y+')"><circle r="17" class="lamp '+(value?'on':'')+'"/><text class="signal-bit" y="6">'+value+'</text><text class="signal-label" y="-30">'+label+'</text></g>';}
function wire(x1,y1,x2,y2,value,bend){const mid=bend??((x1+x2)/2);return '<path class="wire '+(value?'on':'')+'" d="M'+x1+' '+y1+'H'+mid+'V'+y2+'H'+x2+'"/>';}
function block(x,y,label,width=94){return '<g transform="translate('+x+' '+y+')"><rect x="-'+width/2+'" y="-23" width="'+width+'" height="46" rx="6" class="gate"/><text class="signal-label" y="6">'+label+'</text></g>';}
function result(label,value){return '<div class="result"><span>'+label+'</span><strong>'+value+'</strong></div>';}
function update(){const word=mode==='alu';document.querySelectorAll('[data-bit]').forEach(el=>el.hidden=word);document.querySelectorAll('[data-word]').forEach(el=>el.hidden=!word);$('cin-control').hidden=mode==='half'||(word&&op!=='ADD');
for(const [id,value] of [['a-bit',a&1],['b-bit',b&1],['cin-bit',cin]]){$(id).textContent=value;$(id).setAttribute('aria-pressed',String(Boolean(value)));}
$('a-word').value=a;$('b-word').value=b;$('op').value=op;
const value=mode==='half'?core.halfAdder(a,b):mode==='full'?core.fullAdder(a,b,cin):core.alu4(a,b,op,cin);
let drawing='';if(mode==='half'){
 drawing=wire(67,80,232,80,a)+wire(67,230,232,80,b,130)+wire(67,80,232,230,a,170)+wire(67,230,232,230,b)+wire(286,80,523,80,value.sum)+wire(286,230,523,230,value.carry)+lamp(50,80,'A',a&1)+lamp(50,230,'B',b&1)+gate('xor',260,80,'XOR',value.sum)+gate('and',260,230,'AND',value.carry)+lamp(540,80,'和 S',value.sum)+lamp(540,230,'进位 C',value.carry);
 $('results').innerHTML=result('和位 S',value.sum)+result('进位 C',value.carry);$('formula').textContent='S = A ⊕ B；C = A ∧ B';$('input-hint').textContent='半加器没有输入进位。绿色连线为高电平 1，灰色连线为低电平 0。';
}else if(mode==='full'){
 drawing=wire(47,60,142,60,a)+wire(47,150,142,60,b,95)+wire(47,60,142,210,a,105)+wire(47,150,142,210,b,120)+wire(196,60,292,60,value.p)+wire(47,280,292,60,cin,250)+wire(196,60,292,180,value.p,232)+wire(47,280,292,180,cin,270)+wire(196,210,427,230,value.g,390)+wire(346,180,427,230,value.t,390)+wire(346,60,553,60,value.sum)+wire(481,230,553,230,value.carry)+lamp(30,60,'A',a&1)+lamp(30,150,'B',b&1)+lamp(30,280,'Cin',cin)+gate('xor',170,60,'A ⊕ B',value.p)+gate('and',170,210,'A ∧ B',value.g)+gate('xor',320,60,'⊕ Cin',value.sum)+gate('and',320,180,'P ∧ Cin',value.t)+gate('or',455,230,'OR',value.carry)+lamp(570,60,'和 S',value.sum)+lamp(570,230,'Cout',value.carry);
 $('results').innerHTML=result('和位 S',value.sum)+result('输出进位 Cout',value.carry);$('formula').textContent='P = A ⊕ B；S = P ⊕ Cin；Cout = (A ∧ B) ∨ (P ∧ Cin)';$('input-hint').textContent='全加器把 A、B 和输入进位 Cin 相加。两个半加器产生和位，或门合并两条进位。';
}else{
 drawing=wire(147,75,253,135,a!==0)+wire(147,205,253,165,b!==0)+wire(300,52,300,115,['ADD','AND','OR','XOR'].indexOf(op)!==0)+wire(347,150,453,150,value.output!==0)+block(100,75,'A '+core.binary(a))+block(100,205,'B '+core.binary(b))+block(300,150,'4 位 ALU')+block(300,30,op)+block(500,150,'F '+core.binary(value.output))+lamp(470,255,'Cout',value.carry)+lamp(555,255,'Z',value.zero);
 $('results').innerHTML=result('结果 F',core.binary(value.output))+result('十进制',value.output)+result('进位 Cout',value.carry)+result('零标志 Z',value.zero);$('formula').textContent=op==='ADD'?'Cout F = A + B + Cin；每一级进位送入下一全加器。':'F = A '+{AND:'∧',OR:'∨',XOR:'⊕'}[op]+' B（逐位逻辑运算）';$('input-hint').textContent='A、B 是 4 位无符号数（0–15）。ADD 串联四个全加器；其他模式对每一位执行逻辑门运算。';
}
$('circuit').innerHTML=drawing;$('stage-title').textContent={half:'半加器信号图',full:'全加器信号图',alu:'4 位 ALU 数据通路'}[mode];$('circuit').setAttribute('aria-label',$('stage-title').textContent);renderTable(value);}
function renderTable(value){const table=$('truth-table');if(mode==='alu'){$('table-title').textContent=op==='ADD'?'逐位加法 · 从最低位到最高位传播进位':'逐位逻辑运算';let rows='';for(let index=0;index<4;index++){const s=value.stages[index];rows+='<tr><td>'+index+'</td><td>'+((a>>index)&1)+'</td><td>'+((b>>index)&1)+'</td><td>'+(s?s.cin:'—')+'</td><td>'+((value.output>>index)&1)+'</td><td>'+(s?s.carry:'—')+'</td></tr>';}
table.innerHTML='<thead><tr><th>位</th><th>Aᵢ</th><th>Bᵢ</th><th>Cᵢ</th><th>Fᵢ</th><th>Cᵢ₊₁</th></tr></thead><tbody>'+rows+'</tbody>';return;}
$('table-title').textContent=(mode==='half'?'半加器':'全加器')+'真值表 · 点击一行加载输入';let rows='';for(let ai=0;ai<2;ai++)for(let bi=0;bi<2;bi++)for(let ci=0;ci<(mode==='full'?2:1);ci++){const v=mode==='half'?core.halfAdder(ai,bi):core.fullAdder(ai,bi,ci);rows+='<tr class="'+(ai===(a&1)&&bi===(b&1)&&(mode==='half'||ci===cin)?'active':'')+'"><td><button data-load="'+[ai,bi,ci].join(',')+'" aria-label="加载 A '+ai+' B '+bi+' Cin '+ci+'">'+ai+'</button></td><td>'+bi+'</td>'+(mode==='full'?'<td>'+ci+'</td>':'')+'<td>'+v.sum+'</td><td>'+v.carry+'</td></tr>';}
table.innerHTML='<thead><tr><th>A</th><th>B</th>'+(mode==='full'?'<th>Cin</th>':'')+'<th>S</th><th>Cout</th></tr></thead><tbody>'+rows+'</tbody>';table.querySelectorAll('[data-load]').forEach(button=>button.onclick=()=>{[a,b,cin]=button.dataset.load.split(',').map(Number);update();});}
function nextQuiz(){question=core.quizQuestion(quizIndex++);quizLocked=false;$('quiz-prompt').textContent=question.prompt;$('quiz-feedback').textContent='';$('quiz-feedback').className='quiz-feedback';$('quiz-next').disabled=true;$('quiz-options').innerHTML=question.options.map(option=>'<button type="button" data-answer="'+option+'">'+option+'</button>').join('');$('quiz-options').querySelectorAll('button').forEach(button=>button.onclick=()=>{if(quizLocked)return;quizLocked=true;answered++;const ok=Number(button.dataset.answer)===question.answer;if(ok)correct++;$('quiz-feedback').textContent=ok?'正确，门电路和进位计算一致。':'本题结果为 '+question.answer+'，可回到对应信号图验证。';$('quiz-feedback').classList.toggle('wrong',!ok);$('quiz-options').querySelectorAll('button').forEach(item=>item.disabled=true);$('quiz-next').disabled=false;$('quiz-status').textContent='已答 '+answered+' 题 · 正确 '+correct+' 题';window.__platformLink?.recordQuizAnswer(ok);});}
document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>{mode=button.dataset.mode;document.querySelectorAll('[data-mode]').forEach(item=>item.setAttribute('aria-selected',String(item===button)));$('explore').hidden=mode==='quiz';$('quiz').hidden=mode!=='quiz';if(mode==='quiz'){if(!question)nextQuiz();}else{if(mode!=='alu'){a&=1;b&=1;}update();}});
$('a-bit').onclick=()=>{a=(a&1)^1;update();};$('b-bit').onclick=()=>{b=(b&1)^1;update();};$('cin-bit').onclick=()=>{cin^=1;update();};
for(const id of ['a-word','b-word'])$(id).oninput=()=>{const value=Math.min(15,Math.max(0,Math.floor(Number($(id).value)||0)));if(id==='a-word')a=value;else b=value;update();};$('op').onchange=()=>{op=$('op').value;update();};$('quiz-next').onclick=nextQuiz;update();
})();
</script><script src="platform-link.js"></script></body></html>
