# 计算机组成原理实训平台 —— Nginx 反向代理
# 由 deploy/deploy.sh 安装到 /etc/nginx/conf.d/zcyl-platform.conf
# 若服务器上已有宝塔 / 其它站点占用 80，请把这台站点的 server_name 换成域名，
# 或改成别的监听端口。

server {
    listen 80;
    listen [::]:80;
    server_name @SERVER_NAME@;

    # 课件 PPT 上传较大，留足请求体
    client_max_body_size 128m;

    # 静态资源交给后端（Express 会直接吐 prototype/dist）
    location / {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 健康检查不走缓存
    location = /api/health {
        proxy_pass http://127.0.0.1:@PORT@/api/health;
        access_log off;
    }
}
